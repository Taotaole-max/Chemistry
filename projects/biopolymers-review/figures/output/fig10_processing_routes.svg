   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(46.423961 135.384409)">Cellulose → NMMO/Lyocell,</text>
