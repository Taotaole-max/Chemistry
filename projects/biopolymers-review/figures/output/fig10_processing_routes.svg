   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(116.193792 19.46593)">Does a stable melt window exist above Tm</text>
    <text style="font-weight: 700; font-size: 6.9px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(103.168964 26.91665)">and below decomposition/hydrolysis onset? (§5.1)</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1a1a19" x="67.345512" y="46.184882" transform="rotate(-0 67.345512 46.184882)">No</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #1a1a19" x="304.605354" y="46.184882" transform="rotate(-0 304.605354 46.184882)">Yes</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #ffffff" x="67.345512" y="73.148669" transform="rotate(-0 67.345512 73.148669)">Solution processing</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #ffffff" x="304.605354" y="73.104794" transform="rotate(-0 304.605354 73.104794)">Melt processing</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(27.454512 105.203936)">Cellulose → NMMO/Lyocell,</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(36.224512 113.344249)">LiCl/DMAc dissolution</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(18.256012 142.527948)">Chitosan → dilute-acid dissolution,</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(39.778512 149.815261)">wet/dry-jet spinning</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(261.827675 98.752244)">PBS → wide window (~110 °C),</text>
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(284.267573 106.477144)">least restrictive</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(260.079643 131.492402)">PHB → narrow window (~25 °C),</text>
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(277.823018 138.611114)">tight thermal control</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(259.01119 164.442723)">PLA → must be dried first, or melt</text>
    <text style="font-size: 6.1px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(268.336565 171.388443)">hydrolysis erodes MW (§4)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(32.556933 197.965716)">Widen whichever window exists: plasticisers (cost: stiffness) · nucleating agents (speed PLA crystallisation) ·</text>
    <text style="font-size: 6.4px; font-family: 'Arial', 'Helvetica', 'Liberation Sans', 'DejaVu Sans', sans-serif; fill: #1a1a19" transform="translate(64.378433 205.473528)">compatibilised blends (PLA/PBAT, PLA/TPS) · nanocellulose/nanochitin reinforcement</text>
   </g>
